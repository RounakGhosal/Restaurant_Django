<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Restaurant{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f9fa;
        }

        /* Navbar */
        .navbar {
            padding: 14px 30px;
            background: linear-gradient(135deg, #212529, #343a40) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: white !important;
            text-decoration: none;
            pointer-events: none;
            cursor: default;
        }

        .navbar-brand i {
            color: #ffc107;
            margin-right: 8px;
        }

        .nav-link {
            color: #ddd !important;
            margin: 0 5px;
            padding: 8px 14px !important;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: white !important;
            background-color: rgba(255, 255, 255, 0.12);
        }

        .nav-link.active {
            color: #212529 !important;
            background-color: #ffc107;
        }

        /* Dropdown */
        .dropdown-menu {
            border: none;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .dropdown-item {
            border-radius: 8px;
            padding: 10px 15px;
            transition: 0.2s;
        }

        .dropdown-item:hover {
            background-color: #ffc107;
        }

        /* Search */
        .search-box {
            border-radius: 25px;
            border: none;
            padding: 9px 16px;
        }

        .search-btn {
            border-radius: 25px;
            padding: 9px 18px;
            margin-left: 5px;
        }

    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand" href="/home">
            <i class="bi bi-cup-hot-fill"></i>
            My Restaurant
        </a>

        <!-- Mobile button -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navbar -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Home -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">
                        <i class="bi bi-house-door"></i>
                        Home
                    </a>
                </li>

                <!-- About -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'about' %}">
                        <i class="bi bi-info-circle"></i>
                        About
                    </a>
                </li>

                <!-- Services -->
                <li class="nav-item dropdown">

    <a class="nav-link dropdown-toggle"
       href="#"
       role="button"
       data-bs-toggle="dropdown"
       aria-expanded="false">

        <i class="bi bi-grid"></i>
        Services

    </a>

    <ul class="dropdown-menu">

        <li>
            <a class="dropdown-item" href="{% url 'dine_in' %}">
                <i class="bi bi-shop"></i>
                Dine In
            </a>
        </li>

        <li>
            <a class="dropdown-item" href="{% url 'delivery' %}">
                <i class="bi bi-truck"></i>
                Delivery
            </a>
        </li>

        <li>
            <hr class="dropdown-divider">
        </li>

        <li>
            <a class="dropdown-item" href="{% url 'contact' %}">
                <i class="bi bi-envelope"></i>
                Contact Us
            </a>
        </li>

    </ul>

</li>

            </ul>

            <!-- Search -->
        <form class="d-flex" role="search" method="get" action="{% url 'search' %}">
            <input class="form-control search-box"
                type="search"
                name="q"
                value="{{ request.GET.q|default:'' }}"
                placeholder="Search..."
                aria-label="Search">

            <button class="btn btn-warning search-btn" type="submit">
                <i class="bi bi-search"></i>
                Search
            </button>

        </form>

        </div>

    </div>

</nav>

<!-- Page-specific content will appear here -->
{% block content %}
{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
