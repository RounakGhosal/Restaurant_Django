{% extends 'base.html' %}

{% block title %}
Home Page
{% endblock %}


{% block content %}

<style>

    .hero {
        min-height: 600px;

        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;

        background:
            linear-gradient(
                rgba(0, 0, 0, 0.65),
                rgba(0, 0, 0, 0.65)
            ),
            linear-gradient(135deg, #ffb347, #ffcc33);

        color: white;
    }

    .hero-content {
        max-width: 800px;
        padding: 40px;
    }

    .hero h1 {
        font-size: 3.5rem;
        font-weight: 700;
        margin-bottom: 20px;
    }

    .hero p {
        font-size: 1.2rem;
        margin-bottom: 30px;
    }

    .hero-btn {
        padding: 12px 28px;
        border-radius: 30px;
        font-weight: bold;
        margin: 5px;
    }

</style>


<section class="hero">

    <div class="hero-content">

        <h1>
            Welcome to My Restaurant 🍽️
        </h1>

        <p>
            Delicious food, great atmosphere,
            and an unforgettable dining experience.
        </p>

        <a href="{% url 'services' %}" class="btn btn-warning hero-btn">
            Explore Services
        </a>

        <a href="{% url 'contact' %}" class="btn btn-outline-light hero-btn">
            Contact Us
        </a>

    </div>

</section>

{% endblock %}
